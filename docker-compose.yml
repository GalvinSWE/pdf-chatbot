version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pdf-chatbot-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdfchatbot

    ports:
      - "5433:5432"

  ollama:
    image: ollama/ollama
    container_name: pdf-chatbot-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: