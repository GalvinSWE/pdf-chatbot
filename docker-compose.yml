services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pdf-chatbot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdfchatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ollama:
  #   image: ollama/ollama
  #   container_name: pdf-chatbot-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    container_name: pdf-chatbot-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      # - ollama

  # worker:
  #   build:
  #     context: ./backend
  #   container_name: pdf-chatbot-worker
  #   env_file:
  #     - .env
  #   command: ["python", "-m", "app.worker"]
  #   depends_on:
  #     - db
  #     - ollama

  frontend:
    build:
      context: ./frontend
    container_name: pdf-chatbot-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  # ollama_data: